# A separate, read-only public instance. Run with project name feedwire-showcase
# and --env-file .env.showcase. It has its own DB/Redis and no RSSHub cookies.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feedwire
      POSTGRES_USER: feedwire
      POSTGRES_PASSWORD: ${SHOWCASE_DB_PASSWORD:?Set SHOWCASE_DB_PASSWORD in .env.showcase}
    volumes:
      - showcase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedwire"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
      PUBLIC_READ_ONLY: "true"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GEMINI_API_KEY: ""
      REDDIT_RSS_USER: ""
      REDDIT_RSS_FEED: ""
      TWITTER_AUTH_TOKEN: ""
      PUBLIC_FRESH_FEEDS: "true"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
      REDDIT_RSS_USER: ""
      REDDIT_RSS_FEED: ""
      TWITTER_AUTH_TOKEN: ""
      PUBLIC_FRESH_FEEDS: "true"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q feeds
    restart: unless-stopped

  control-worker:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
      REDDIT_RSS_USER: ""
      REDDIT_RSS_FEED: ""
      TWITTER_AUTH_TOKEN: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2 -Q control
    restart: unless-stopped

  beat:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${SHOWCASE_DB_PASSWORD}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      args:
        PUBLIC_SHOWCASE: "true"
    expose:
      - "3000"
    environment:
      ORIGIN: ${SHOWCASE_ORIGIN:-http://localhost:8089}
      PUBLIC_SHOWCASE: "true"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${SHOWCASE_HTTP_PORT:-8089}:80"
    volumes:
      - ./config/nginx.showcase.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  showcase-pgdata:
