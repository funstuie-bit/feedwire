services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feedwire
      POSTGRES_USER: feedwire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port publish — db is reached by service name from app containers
    # on the compose network. Publishing to 0.0.0.0 exposed it to the LAN.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedwire"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port publish — redis is reached by service name and has no
    # password, so exposing 6379 on the LAN was an unauthenticated open door.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Reddit RSS auth params (from reddit.com/prefs/feeds/). Injected into
      # any *.reddit.com URL by services/feed_parser.py:_apply_reddit_auth.
      REDDIT_RSS_USER: ${REDDIT_RSS_USER:-}
      REDDIT_RSS_FEED: ${REDDIT_RSS_FEED:-}
      # OrbStack injects proxy env vars including an IPv6 CIDR in no_proxy
      # which httpx can't parse ("Invalid port: 'b51a:cc66:f0::'"). Clear them.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    # Production: no --reload. With --reload, uvicorn's WatchFiles reloader
    # stays alive when the worker dies on startup (e.g. DB still booting after
    # nightly backup), leaving the container "Up" with no working API. Without
    # --reload, uvicorn exits → container exits → restart: unless-stopped kicks in.
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/feeds', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Reddit RSS auth params — worker fetches feeds too (polling job).
      REDDIT_RSS_USER: ${REDDIT_RSS_USER:-}
      REDDIT_RSS_FEED: ${REDDIT_RSS_FEED:-}
      # Same OrbStack proxy clean-up as backend.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    # Consumes ONLY the high-volume feed-fetch queue. Concurrency raised 4→8 so
    # the fetch fan-out actually drains (the old rate_limit=10/m + concurrency=4
    # capped throughput below the enqueue rate and snowballed a 383k backlog).
    command: celery -A celery_app worker --loglevel=info --concurrency=8 -Q feeds
    restart: unless-stopped

  # Dedicated worker for the low-frequency control tasks (digest, alerts,
  # relevance, cleanup, fetch_all_feeds). Isolated from the feed-fetch flood so
  # the once-a-day digest is never stuck behind a feeds backlog. See §4.13.
  control-worker:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDDIT_RSS_USER: ${REDDIT_RSS_USER:-}
      REDDIT_RSS_FEED: ${REDDIT_RSS_FEED:-}
      # Same OrbStack proxy clean-up as backend/worker.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: celery -A celery_app worker --loglevel=info --concurrency=2 -Q control
    restart: unless-stopped

  beat:
    build: ./src/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      DATABASE_URL_SYNC: postgresql://feedwire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/feedwire
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    expose:
      - "3000"
    depends_on:
      - backend
    environment:
      PUBLIC_API_URL: http://backend:8000
      ORIGIN: http://localhost:8088
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub
    expose:
      - "1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/1
      REQUEST_TIMEOUT: 30000
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
